<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keuangan Keluarga</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {font-family: Arial; background:#eef2f7; padding:10px;}
.box {background:white; padding:15px; border-radius:10px; margin-bottom:15px;}
input, select, button {width:100%; padding:10px; margin-top:10px;}
button {background:#4CAF50; color:white; border:none;}
table {width:100%; border-collapse:collapse; font-size:12px;}
th,td {border:1px solid #ccc; padding:5px; text-align:center;}
th {background:#ddd;}
canvas {max-height:200px;}
</style>

<script>

var chart1, chart2;

var rincianData = {
  "Hiburan": ["Makan", "Nonton", "Jalan"],
  "Upacara": ["Banten", "Dana Punia", "Persembahyangan"],
  "Bekal Anak": ["Jajan", "Alat Tulis", "Transport"],
  "Lain-lain": ["Bebas"]
};

function formatAngka(angka){
  return angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function updateRincian(){
  var kategori = document.getElementById("kategori").value;
  var rincian = document.getElementById("rincian");

  rincian.innerHTML = "";

  rincianData[kategori].forEach(function(item){
    var opt = document.createElement("option");
    opt.value = item;
    opt.text = item;
    rincian.appendChild(opt);
  });
}

function tambah(){
  var jenis = document.getElementById("jenis").value;
  var kategori = document.getElementById("kategori").value;
  var rincian = document.getElementById("rincian").value;
  var jumlah = document.getElementById("jumlah").value;
  var keterangan = document.getElementById("keterangan").value;

  // tanggal
  var tanggal = document.getElementById("tanggal").value;

  if(jumlah==""){ alert("Isi jumlah!"); return;}
  if(tanggal==""){ alert("Isi tanggal!"); return;}

  var t = document.getElementById("tabel");
  var r = t.insertRow();

  r.insertCell(0).innerHTML = tanggal;
  r.insertCell(1).innerHTML = jenis;
  r.insertCell(2).innerHTML = kategori;
  r.insertCell(3).innerHTML = rincian;
  r.insertCell(4).innerHTML = jumlah;
  r.insertCell(5).innerHTML = keterangan;
  r.insertCell(6).innerHTML = "<button onclick='hapus(this)'>X</button>";

  total();
  simpan();

  document.getElementById("jumlah").value = "";
  document.getElementById("keterangan").value = "";
}

function hapus(btn){
  var r = btn.parentNode.parentNode;
  r.remove();
  total();
  simpan();
}

function total(){
  var t = document.getElementById("tabel");

  var totalMasuk = 0;
  var totalKeluar = 0;
  var kategoriKeluar = {};

  for(var i=1;i<t.rows.length;i++){
    var jenis = t.rows[i].cells[1].innerHTML;
    var kategori = t.rows[i].cells[2].innerHTML;
    var jumlah = parseFloat(t.rows[i].cells[4].innerHTML);

    if(jenis=="Pemasukan"){
      totalMasuk += jumlah;
    } else {
      totalKeluar += jumlah;

      if(!kategoriKeluar[kategori]){
        kategoriKeluar[kategori] = 0;
      }
      kategoriKeluar[kategori] += jumlah;
    }
  }

  document.getElementById("total").innerHTML =
    "Pemasukan: " + formatAngka(totalMasuk) +
    "<br>Pengeluaran: " + formatAngka(totalKeluar);

  tampilGrafikTotal(totalMasuk, totalKeluar);
  tampilGrafikKategori(kategoriKeluar);

  cekPeringatan(totalMasuk, totalKeluar);
}

function cekPeringatan(masuk, keluar){
  var saldo = masuk - keluar;
  var el = document.getElementById("peringatan");

  if(saldo < 0){
    el.style.color = "red";
    el.innerHTML = "⚠️ Anggaran minus Rp " + formatAngka(Math.abs(saldo));
  } else {
    el.style.color = "green";
    el.innerHTML = "✅ Sisa saldo: Rp " + formatAngka(saldo);
  }
}

function tampilGrafikTotal(masuk, keluar){
  var ctx = document.getElementById("grafik1").getContext("2d");

  if(chart1){ chart1.destroy(); }

  chart1 = new Chart(ctx, {
    type: "bar",
    data: {
      labels: ["Pemasukan", "Pengeluaran"],
      datasets: [{ label: "Jumlah", data: [masuk, keluar] }]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });
}

function tampilGrafikKategori(dataKategori){
  var ctx = document.getElementById("grafik2").getContext("2d");

  if(chart2){ chart2.destroy(); }

  chart2 = new Chart(ctx, {
    type: "bar",
    data: {
      labels: Object.keys(dataKategori),
      datasets: [{ label: "Pengeluaran", data: Object.values(dataKategori) }]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });
}

function simpan(){
  var t = document.getElementById("tabel");
  var data=[];

  for(var i=1;i<t.rows.length;i++){
    var row=[];
    for(var j=0;j<6;j++){
      row.push(t.rows[i].cells[j].innerHTML);
    }
    data.push(row);
  }

  localStorage.setItem("keuangan", JSON.stringify(data));
}

function load(){
  var data = JSON.parse(localStorage.getItem("keuangan")||"[]");
  var t = document.getElementById("tabel");

  data.forEach(function(item){
    var r = t.insertRow();
    for(var i=0;i<6;i++){
      r.insertCell(i).innerHTML=item[i];
    }
    r.insertCell(6).innerHTML="<button onclick='hapus(this)'>X</button>";
  });

  total();
}

</script>
</head>

<body onload="updateRincian(); load();">

<div class="box">
<h3>Input</h3>

<!-- TAMBAH TANGGAL -->
<input type="date" id="tanggal">

<select id="jenis">
<option>Pemasukan</option>
<option>Pengeluaran</option>
</select>

<select id="kategori" onchange="updateRincian()">
<option>Hiburan</option>
<option>Upacara</option>
<option>Bekal Anak</option>
<option>Lain-lain</option>
</select>

<select id="rincian"></select>

<input type="text" id="keterangan" placeholder="Keterangan">
<input type="number" id="jumlah" placeholder="Jumlah">

<button onclick="tambah()">Tambah</button>
</div>

<div class="box">
<h3>Transaksi</h3>

<table id="tabel">
<tr>
<th>Tanggal</th>
<th>Jenis</th>
<th>Kategori</th>
<th>Rincian</th>
<th>Jumlah</th>
<th>Keterangan</th>
<th>X</th>
</tr>
</table>
</div>

<div class="box">
<h3>Total</h3>
<div id="total"></div>
<div id="peringatan" style="margin-top:10px; font-weight:bold;"></div>
</div>

<div class="box">
<h3>Grafik</h3>
<canvas id="grafik1"></canvas>
<canvas id="grafik2"></canvas>
</div>

</body>
</html>
