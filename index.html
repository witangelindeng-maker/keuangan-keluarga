<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplikasi Keuangan</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {font-family: Arial; background:#eef2f7; padding:10px;}
.box {background:white; padding:15px; border-radius:10px; margin-bottom:15px;}
input, select, button {width:100%; padding:10px; margin-top:10px;}
button {background:#4CAF50; color:white; border:none;}
table {width:100%; border-collapse:collapse; font-size:12px;}
th,td {border:1px solid #ccc; padding:5px; text-align:center;}
th {background:#ddd;}
canvas {max-height:200px;}
</style>

<script>

var data = JSON.parse(localStorage.getItem("keuangan")||"[]");
var chart1, chart2;

// format 1000000 → 1.000.000
function formatAngka(x){
  if(!x) return "";
  return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");
}

// ubah "1.000.000" → 1000000
function parseAngka(x){
  if(!x) return 0;
  return parseFloat(x.toString().replace(/\./g,"")) || 0;
}

// AUTO FORMAT INPUT
document.addEventListener("DOMContentLoaded", function(){
  var input = document.getElementById("jumlah");

  input.addEventListener("input", function(){
    var angka = this.value.replace(/\D/g,"");
    this.value = formatAngka(angka);
  });
});

function tambah(){
  var tgl = document.getElementById("tanggal").value;
  var jenis = document.getElementById("jenis").value;
  var kategori = document.getElementById("kategori").value;
  var rincian = document.getElementById("rincian").value;
  var jumlah = parseAngka(document.getElementById("jumlah").value);
  var ket = document.getElementById("keterangan").value;

  if(!tgl || !jumlah){ alert("Isi lengkap!"); return;}

  data.push([tgl,jenis,kategori,rincian,jumlah,ket]);
  localStorage.setItem("keuangan",JSON.stringify(data));

  load();
}

function hapus(i){
  data.splice(i,1);
  localStorage.setItem("keuangan",JSON.stringify(data));
  load();
}

function filterBulan(arr){
  var b = document.getElementById("bulan").value;
  if(!b) return arr;

  return arr.filter(x => x[0].slice(0,7)===b);
}

function load(){
  var t = document.getElementById("tabel");
  t.innerHTML = `
  <tr>
  <th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Rincian</th><th>Jumlah</th><th>Keterangan</th><th>Aksi</th>
  </tr>`;

  var d = filterBulan(data);

  var masuk=0, keluar=0;
  var kategori={};

  d.forEach(function(x,i){
    var r = t.insertRow();
    r.insertCell(0).innerHTML=x[0];
    r.insertCell(1).innerHTML=x[1];
    r.insertCell(2).innerHTML=x[2];
    r.insertCell(3).innerHTML=x[3];
    r.insertCell(4).innerHTML=formatAngka(x[4]);
    r.insertCell(5).innerHTML=x[5];
    r.insertCell(6).innerHTML="<button onclick='hapus("+i+")'>X</button>";

    // 🔥 FIX UTAMA ADA DI SINI
    var nilai = parseAngka(x[4]);

    if(x[1]=="Pemasukan"){
      masuk += nilai;
    } else {
      keluar += nilai;
      if(!kategori[x[2]]) kategori[x[2]]=0;
      kategori[x[2]] += nilai;
    }
  });

  document.getElementById("total").innerHTML =
  "Pemasukan: "+formatAngka(masuk)+"<br>Pengeluaran: "+formatAngka(keluar);

  var sisa = masuk - keluar;

  document.getElementById("peringatan").innerHTML =
  (sisa < 0) ?
  "⚠️ Anggaran Minus Rp "+formatAngka(Math.abs(sisa)) :
  "✅ Sisa Rp "+formatAngka(sisa);

  tampilChart(masuk, keluar, kategori);
}

function tampilChart(masuk, keluar, kategori){

  if(chart1) chart1.destroy();
  if(chart2) chart2.destroy();

  chart1 = new Chart(document.getElementById("chart1"),{
    type:"bar",
    data:{
      labels:["Masuk","Keluar"],
      datasets:[{data:[masuk, keluar]}]
    },
    options:{responsive:true, maintainAspectRatio:false}
  });

  chart2 = new Chart(document.getElementById("chart2"),{
    type:"bar",
    data:{
      labels:Object.keys(kategori),
      datasets:[{data:Object.values(kategori)}]
    },
    options:{responsive:true, maintainAspectRatio:false}
  });
}

</script>
</head>

<body onload="load()">

<div class="box">
<h3>Input</h3>

<input type="date" id="tanggal">

<select id="jenis">
<option>Pemasukan</option>
<option>Pengeluaran</option>
</select>

<select id="kategori">
<option>Lain-lain</option>
<option>Hiburan</option>
<option>Belanja</option>
<option>Makan</option>
</select>


<input type="text" id="keterangan" placeholder="Keterangan">
<input type="text" id="jumlah" placeholder="Jumlah (contoh 2500000)">

<button onclick="tambah()">Tambah</button>
</div>

<div class="box">
<h3>Filter Bulan</h3>
<input type="month" id="bulan">
<button onclick="load()">Filter</button>
</div>

<div class="box">
<h3>Data</h3>
<table id="tabel"></table>
</div>

<div class="box">
<h3>Total</h3>
<div id="total"></div>
<div id="peringatan" style="font-weight:bold; margin-top:10px;"></div>
</div>

<div class="box">
<h3>Grafik</h3>
<canvas id="chart1"></canvas>
<canvas id="chart2"></canvas>
</div>

</body>
</html>
