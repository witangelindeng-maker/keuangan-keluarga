<!DOCTYPE html>
<html>
<head>
 <link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#4CAF50">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>keuangan keluarga</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {font-family: Arial; background:#eef2f7; padding:10px;}
.box {background:white; padding:15px; border-radius:10px; margin-bottom:15px;}
input, select, button {width:100%; padding:10px; margin-top:10px;}
button {background:#4CAF50; color:white; border:none;}
table {width:100%; border-collapse:collapse; font-size:12px;}
th,td {border:1px solid #ccc; padding:5px; text-align:center;}
th {background:#ddd;}
</style>

<script>

var chart1, chart2;

var rincianData = {
  "Hiburan": ["Makan", "Nonton", "Jalan"],
  "Upacara": ["Banten", "Dana Punia", "Persembahyangan"],
  "Bekal Anak": ["Jajan", "Alat Tulis", "Transport"],
  "Lain-lain": ["Bebas"]
};

// FORMAT RUPIAH
function formatRupiah(angka){
  angka = angka.toString().replace(/\D/g, "");
  return angka.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

// INPUT FORMAT OTOMATIS
function formatInputRupiah(input){
  var value = input.value.replace(/\D/g, "");
  input.value = value.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

// UPDATE RINCIAN
function updateRincian(){
  var kategori = document.getElementById("kategori").value;
  var rincian = document.getElementById("rincian");

  rincian.innerHTML = "";

  rincianData[kategori].forEach(function(item){
    var opt = document.createElement("option");
    opt.value = item;
    opt.text = item;
    rincian.appendChild(opt);
  });
}

// TAMBAH DATA
function tambah(){
  var jenis = document.getElementById("jenis").value;
  var kategori = document.getElementById("kategori").value;
  var rincian = document.getElementById("rincian").value;
  var jumlah = document.getElementById("jumlah").value.replace(/\./g, "");
  var keterangan = document.getElementById("keterangan").value;
  var tanggal = document.getElementById("tanggal").value;

  if(jumlah==""){ alert("Isi jumlah!"); return;}

  var t = document.getElementById("tabel");
  var r = t.insertRow();

  r.insertCell(0).innerHTML = tanggal;
  r.insertCell(1).innerHTML = jenis;
  r.insertCell(2).innerHTML = kategori;
  r.insertCell(3).innerHTML = rincian;
  r.insertCell(4).innerHTML = formatRupiah(jumlah);
  r.insertCell(5).innerHTML = keterangan;
  r.insertCell(6).innerHTML = "<button onclick='hapus(this)'>X</button>";

  total();
  simpan();

  document.getElementById("jumlah").value = "";
  document.getElementById("keterangan").value = "";
}

// HAPUS
function hapus(btn){
  var r = btn.parentNode.parentNode;
  r.remove();
  total();
  simpan();
}

// AMBIL BULAN
function getBulan(tgl){
  return tgl ? tgl.substring(0,7) : "";
}

// TOTAL + FILTER
function total(){
  var t = document.getElementById("tabel");
  var filterBulan = document.getElementById("filterBulan").value;

  var totalMasuk = 0;
  var totalKeluar = 0;
  var kategoriKeluar = {};

  for(var i=1;i<t.rows.length;i++){
    var tanggal = t.rows[i].cells[0].innerHTML;
    var jenis = t.rows[i].cells[1].innerHTML;
    var kategori = t.rows[i].cells[2].innerHTML;
    var jumlah = parseFloat(t.rows[i].cells[4].innerHTML.replace(/\./g, ""));

    if(filterBulan && getBulan(tanggal) !== filterBulan){
      continue;
    }

    if(jenis=="Pemasukan"){
      totalMasuk += jumlah;
    } else {
      totalKeluar += jumlah;

      if(!kategoriKeluar[kategori]){
        kategoriKeluar[kategori] = 0;
      }
      kategoriKeluar[kategori] += jumlah;
    }
  }

  var sisa = totalMasuk - totalKeluar;

var saldoText = formatRupiah(Math.abs(sisa));
var warna = "black";

// kalau minus
if (sisa < 0) {
  saldoText = "-" + saldoText;
  warna = "red";
}

document.getElementById("total").innerHTML =
  "Pemasukan: " + formatRupiah(totalMasuk) + "<br>" +
  "Pengeluaran: " + formatRupiah(totalKeluar) + "<br>" +
  "<span style='color:" + warna + "'>Saldo: " + saldoText + "</span>";

  if(sisa < 0){
    alert("⚠️ Saldo minus " + formatRupiah(Math.abs(sisa)));
  }

  grafik(totalMasuk, totalKeluar, kategoriKeluar);
}

// GRAFIK
function grafik(masuk, keluar, kategoriData){
  if(chart1){ chart1.destroy(); }
  if(chart2){ chart2.destroy(); }

  chart1 = new Chart(document.getElementById("grafik1"), {
    type: "bar",
    data: {
      labels: ["Pemasukan", "Pengeluaran"],
      datasets: [{ data: [masuk, keluar] }]
    }
  });

  chart2 = new Chart(document.getElementById("grafik2"), {
    type: "bar",
    data: {
      labels: Object.keys(kategoriData),
      datasets: [{ data: Object.values(kategoriData) }]
    }
  });
}

// SIMPAN
function simpan(){
  var t = document.getElementById("tabel");
  var data=[];

  for(var i=1;i<t.rows.length;i++){
    var row=[];
    for(var j=0;j<6;j++){
      row.push(t.rows[i].cells[j].innerHTML);
    }
    data.push(row);
  }

  localStorage.setItem("keuangan", JSON.stringify(data));
}

// LOAD
function load(){
  var data = JSON.parse(localStorage.getItem("keuangan")||"[]");
  var t = document.getElementById("tabel");

  data.forEach(function(item){
    var r = t.insertRow();
    for(var i=0;i<6;i++){
      r.insertCell(i).innerHTML=item[i];
    }
    r.insertCell(6).innerHTML="<button onclick='hapus(this)'>X</button>";
  });

  total();
}

window.onload = function(){
  updateRincian();
  load();
}

</script>
</head>

<body>

<div class="box">
<h3>Input</h3>

<input type="date" id="tanggal">

<select id="jenis">
<option>Pemasukan</option>
<option>Pengeluaran</option>
</select>

<select id="kategori" onchange="updateRincian()">
<option>Hiburan</option>
<option>Upacara</option>
<option>Bekal Anak</option>
<option>Lain-lain</option>
</select>

<select id="rincian"></select>

<input type="text" id="keterangan" placeholder="Keterangan">
<input type="text" id="jumlah" placeholder="Jumlah" oninput="formatInputRupiah(this)">

<button onclick="tambah()">Tambah</button>
</div>

<div class="box">
<h3>Filter Bulan</h3>
<input type="month" id="filterBulan" onchange="total()">
</div>

<div class="box">
<h3>Transaksi</h3>

<table id="tabel">
<tr>
<th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Rincian</th><th>Jumlah</th><th>Keterangan</th><th>X</th>
</tr>
</table>
</div>

<div class="box">
<h3>Total</h3>
<div id="total"></div>
</div>

<div class="box">
<h3>Grafik</h3>
<canvas id="grafik1"></canvas>
</div>

<div class="box">
<h3>Grafik Kategori</h3>
<canvas id="grafik2"></canvas>
</div>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
