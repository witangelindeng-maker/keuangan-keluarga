<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

var chart1, chart2;

var rincianData = {
  "Hiburan": ["Makan", "Nonton", "Jalan"],
  "Upacara": ["Banten", "Dana Punia", "Persembahyangan"],
  "Bekal Anak": ["Jajan", "Alat Tulis", "Transport"],
  "Lain-lain": ["Bebas"]
};

// format rupiah
function formatRupiah(angka){
  return angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

// update rincian
function updateRincian(){
  var kategori = document.getElementById("kategori").value;
  var rincian = document.getElementById("rincian");

  rincian.innerHTML = "";

  rincianData[kategori].forEach(function(item){
    var opt = document.createElement("option");
    opt.value = item;
    opt.text = item;
    rincian.appendChild(opt);
  });
}

// tambah data
function tambah(){
  var jenis = document.getElementById("jenis").value;
  var kategori = document.getElementById("kategori").value;
  var rincian = document.getElementById("rincian").value;
  var jumlah = document.getElementById("jumlah").value;
  var keterangan = document.getElementById("keterangan").value;
  var tanggal = document.getElementById("tanggal").value;

  if(jumlah==""){ alert("Isi jumlah!"); return;}

  var t = document.getElementById("tabel");
  var r = t.insertRow();

  r.insertCell(0).innerHTML = tanggal;
  r.insertCell(1).innerHTML = jenis;
  r.insertCell(2).innerHTML = kategori;
  r.insertCell(3).innerHTML = rincian;
  r.insertCell(4).innerHTML = jumlah;
  r.insertCell(5).innerHTML = keterangan;
  r.insertCell(6).innerHTML = "<button onclick='hapus(this)'>X</button>";

  total();
  simpan();

  document.getElementById("jumlah").value = "";
  document.getElementById("keterangan").value = "";
}

// hapus
function hapus(btn){
  var r = btn.parentNode.parentNode;
  r.remove();
  total();
  simpan();
}

// ambil bulan dari tanggal
function getBulan(tgl){
  return tgl ? tgl.substring(0,7) : "";
}

// filter + hitung
function total(){
  var t = document.getElementById("tabel");

  var filterBulan = document.getElementById("filterBulan").value;

  var totalMasuk = 0;
  var totalKeluar = 0;
  var kategoriKeluar = {};

  for(var i=1;i<t.rows.length;i++){
    var tanggal = t.rows[i].cells[0].innerHTML;
    var jenis = t.rows[i].cells[1].innerHTML;
    var kategori = t.rows[i].cells[2].innerHTML;
    var jumlah = parseFloat(t.rows[i].cells[4].innerHTML);

    // FILTER BULAN
    if(filterBulan && getBulan(tanggal) !== filterBulan){
      continue;
    }

    if(jenis=="Pemasukan"){
      totalMasuk += jumlah;
    } else {
      totalKeluar += jumlah;

      if(!kategoriKeluar[kategori]){
        kategoriKeluar[kategori] = 0;
      }
      kategoriKeluar[kategori] += jumlah;
    }
  }

  var sisa = totalMasuk - totalKeluar;

  document.getElementById("total").innerHTML =
    "Pemasukan: " + formatRupiah(totalMasuk) + "<br>" +
    "Pengeluaran: " + formatRupiah(totalKeluar) + "<br>" +
    "Saldo: " + formatRupiah(sisa);

  if(sisa < 0){
    alert("⚠️ Saldo minus " + formatRupiah(Math.abs(sisa)));
  }

  tampilGrafikTotal(totalMasuk, totalKeluar);
  tampilGrafikKategori(kategoriKeluar);
}

// grafik total
function tampilGrafikTotal(masuk, keluar){
  var ctx = document.getElementById("grafik1").getContext("2d");

  if(chart1){ chart1.destroy(); }

  chart1 = new Chart(ctx, {
    type: "bar",
    data: {
      labels: ["Pemasukan", "Pengeluaran"],
      datasets: [{
        data: [masuk, keluar]
      }]
    }
  });
}

// grafik kategori
function tampilGrafikKategori(dataKategori){
  var ctx = document.getElementById("grafik2").getContext("2d");

  if(chart2){ chart2.destroy(); }

  var labels = Object.keys(dataKategori);
  var data = Object.values(dataKategori);

  chart2 = new Chart(ctx, {
    type: "bar",
    data: {
      labels: labels,
      datasets: [{
        data: data
      }]
    }
  });
}

// simpan
function simpan(){
  var t = document.getElementById("tabel");
  var data=[];

  for(var i=1;i<t.rows.length;i++){
    var row=[];
    for(var j=0;j<6;j++){
      row.push(t.rows[i].cells[j].innerHTML);
    }
    data.push(row);
  }

  localStorage.setItem("keuangan", JSON.stringify(data));
}

// load
function load(){
  var data = JSON.parse(localStorage.getItem("keuangan")||"[]");
  var t = document.getElementById("tabel");

  data.forEach(function(item){
    var r = t.insertRow();
    for(var i=0;i<6;i++){
      r.insertCell(i).innerHTML=item[i];
    }
    r.insertCell(6).innerHTML="<button onclick='hapus(this)'>X</button>";
  });

  total();
}

</script>
